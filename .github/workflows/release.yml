name: Release on push
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node check-scale-arp.cjs
      - name: Package device
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          files = [
          'Scale Arpeggiator.amxd',
          'scale_arp.js',
          'README.md'
          ]
          with ZipFile('device.zip', 'w', ZIP_DEFLATED) as z:
              for f in files:
                  z.write(f)
          PY
          sha256sum device.zip > device.zip.sha256
      - name: Create versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            tag='v1.0.0'
          fi
          gh release create "$tag" device.zip device.zip.sha256 --title "Scale Arpeggiator $tag" --generate-notes

